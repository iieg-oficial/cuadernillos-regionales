[project]
name = "cuadernillos"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pydantic-settings",
    "matplotlib",
    "jinja2",
    "rich",
]

[dependency-groups]
dev = [
    "pre-commit",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["core", "pipelines"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
