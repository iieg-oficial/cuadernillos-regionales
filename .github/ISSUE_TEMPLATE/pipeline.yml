name: Pipeline
description: Crear un nuevo pipeline de sección
title: "[PIPELINE] "
labels: ["pipeline"]
body:
  - type: input
    id: nombre
    attributes:
      label: Nombre de la sección
      description: Nombre en snake_case, será el nombre del folder en `pipelines/`
      placeholder: "gobierno_y_seguridad"
    validations:
      required: true

  - type: dropdown
    id: fuente
    attributes:
      label: Fuente de datos
      options:
        - PostgreSQL
        - Archivo (CSV / Excel)
        - API
        - Otro
    validations:
      required: true

  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: ¿Qué datos extrae y qué calcula esta sección?
    validations:
      required: true

  - type: textarea
    id: contexto
    attributes:
      label: Variables de contexto
      description: Lista las claves que `run()` debe retornar en su `dict` (deben ser únicas entre secciones)
      placeholder: |
        - `gs_total_delitos`
        - `gs_ranking_municipio`
    validations:
      required: true

  - type: textarea
    id: graficas
    attributes:
      label: Gráficas
      description: Gráficas que debe generar `Analizer` y guardar en `output/charts/{municipio_id}/`
      placeholder: |
        - `gs_delitos_por_tipo.png` — barras horizontales

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: "`pipelines/<nombre>/__init__.py`"
        - label: "`pipelines/<nombre>/pipeline.py` — clase hereda `Section`"
        - label: "`pipelines/<nombre>/extract.py` — clase `Extract(Stage)`"
        - label: "`pipelines/<nombre>/analizer.py` — clase `Analizer(Stage)`"
        - label: "`pipelines/<nombre>/helpers/__init__.py`"
        - label: "`pipelines/<nombre>/charts/__init__.py`"
        - label: "`pipelines/<nombre>/queries/__init__.py` (solo si usa PostgreSQL)"
        - label: "Template `templates/sections/<nombre>.tex.j2` creado (issue separado)"
        - label: "`reporte.tex.j2` incluye el nuevo template"
        - label: "Claves de contexto no colisionan con otras secciones"
